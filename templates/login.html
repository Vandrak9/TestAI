<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prihlásenie · Port Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text: #e6edf3;
      --muted: #8b949e;
      --error: #f85149;
      --info: #58a6ff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }

    .login-box h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 0.3rem;
    }

    .login-box p.sub {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.6rem 0.8rem;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    input:focus {
      outline: 2px solid var(--info);
      border-color: var(--info);
    }

    button {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      padding: 0.7rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    button:hover { background: var(--accent-hover); }

    .error-msg {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid var(--error);
      border-radius: 6px;
      color: var(--error);
      font-size: 0.85rem;
      padding: 0.6rem 0.8rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .lock-icon {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="lock-icon">🔐</div>
  <h1>Port Scanner</h1>
  <p class="sub">Prihláste sa pre prístup k nástroju</p>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <label for="username">Používateľské meno</label>
    <input
      type="text"
      id="username"
      name="username"
      placeholder="admin"
      autocomplete="username"
      autofocus
      required
    />

    <label for="password">Heslo</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="••••••••"
      autocomplete="current-password"
      required
    />

    <button type="submit">Prihlásiť sa</button>
  </form>
</div>

</body>
</html>
